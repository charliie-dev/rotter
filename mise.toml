[tools]
rust = { version = "1.98.1", profile = "minimal", components = ["rustfmt", "clippy"] }
# The engines the pi, letta and opencode shims run under in tests/shims.rs; the tests read these
# lines. Node: pi's and letta's npm packages (Node >= 22.19). Bun: the version pi's release binary
# and opencode's macOS/Linux binaries are compiled with.
node = "24.21.0"
bun = "1.3.14"

[settings.task]
run_auto_install = false

[tasks.fmt]
description = "Format Rust code"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Lint all Rust targets"
run = "cargo clippy --all-targets --locked -- -D warnings"

[tasks.test]
description = "Run all Rust tests"
run = "cargo test --all-targets --locked"

[tasks.test-parsers]
description = "Verify the seven language parsers"
run = "cargo test --test parsers --locked"

[tasks.check]
description = "Check formatting, lint, and tests"
depends = ["fmt-check", "lint", "test"]

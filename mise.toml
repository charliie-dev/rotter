[tools]
# llvm-tools-preview: the LLVM profile tools cargo-llvm-cov runs.
rust = { version = "1.100.0", profile = "minimal", components = [
  "rustfmt",
  "clippy",
  "llvm-tools-preview",
] }
# The engines the pi, letta and opencode shims run under in tests/shims.rs; the tests read these
# lines. Node: pi's and letta's npm packages (Node >= 22.19). Bun: the version pi's release binary
# and opencode's macOS/Linux binaries are compiled with.
node = "26.13.1"
bun = "1.4.4"
# Mutation testing (`mise run mutants`): checks that the tests fail when the code is changed.
"cargo:cargo-mutants" = "27.1.0"
# Source-based coverage (`mise run coverage`), including the rotter binary the tests spawn.
"cargo:cargo-llvm-cov" = "0.9.2"

[settings.task]
run_auto_install = false

[tasks.fmt]
description = "Format Rust code"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Lint all Rust targets"
run = "cargo clippy --all-targets --locked -- -D warnings"

[tasks.test]
description = "Run all Rust tests"
run = "cargo test --all-targets --locked"

[tasks.test-parsers]
description = "Verify the seven language parsers"
run = "cargo test --test parsers --locked"

[tasks.mutants]
description = "Mutation-test the code changed since a base (default main)"
usage = 'arg "[base]" default="main"'
run = '''
diff="$(mktemp "${TMPDIR:-/tmp}/mutants.XXXXXX")"
trap 'rm -f "$diff"' EXIT
git diff "${usage_base?}...HEAD" > "$diff"
cargo mutants --in-diff "$diff" -- --all-targets --locked
'''

[tasks.coverage]
description = "Line and region coverage of all tests, as a summary and LCOV"
run = '''
set -eu
cargo llvm-cov --no-report --all-targets --locked
# A test that kills rotter while it exits leaves a truncated profile, and one unreadable profile
# fails the whole merge: drop those (never all of them blindly), then report.
profdata="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-profdata"
test -x "$profdata" || { echo "coverage: no llvm-profdata at $profdata" >&2; exit 1; }
for profile in target/llvm-cov-target/*.profraw; do
  "$profdata" show "$profile" > /dev/null 2>&1 || {
    echo "coverage: dropping unreadable $profile" >&2
    rm -f "$profile"
  }
done
mkdir -p target/coverage/rust
cargo llvm-cov report --lcov --output-path target/coverage/rust/lcov.info
cargo llvm-cov report --summary-only
'''

[tasks.check]
description = "Check formatting, lint, and tests"
depends = ["fmt-check", "lint", "test"]
